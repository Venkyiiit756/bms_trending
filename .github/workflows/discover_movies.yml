name: Discover Hyderabad Movies

# Every morning (06:00 IST) find Hyderabad's current movies by following the "other movies"
# list inside each movie's own response (the explore page itself is blocked for runners),
# then add new movies to movies.json and re-tier how often each one is polled.
# tracker.py picks the changes up when its next hourly run starts. See MOVIE_CHANGES.md.
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: bms-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install -r requirements.txt
    - name: Discover movies
      run: python discover.py
    - name: Update polling plan
      run: python update_movies.py
    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add catalog.json movies.json MOVIE_CHANGES.md
        git diff --cached --quiet && exit 0
        git commit -m "Update movie list and polling plan [skip ci]"
        for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
