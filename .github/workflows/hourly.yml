name: hourly-boxoffice
on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 UTC (GitHub may delay scheduled runs by many minutes)
  workflow_dispatch: {}
permissions:
  contents: write            # needed to commit the CSVs back
concurrency:
  group: boxoffice
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python boxoffice.py run
      - name: Commit new readings
        run: |
          git config user.name  "boxoffice-bot"
          git config user.email "boxoffice-bot@users.noreply.github.com"
          git add data/box_office_long.csv data/status_log.csv
          git diff --cached --quiet || (git commit -m "data: hourly snapshot" && git push)
