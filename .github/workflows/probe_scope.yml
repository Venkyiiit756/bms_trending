name: Probe scope and showtimes

# Manual diagnostic: is the trending counter city specific, ratings of comparison films, showtime route, buytickets page.
on:
  workflow_dispatch:
    inputs:
      main:
        description: 'Main event code'
        required: true
        default: 'ET00451914'
      others:
        description: 'Other event codes, space separated'
        required: false
        default: 'ET00518674 ET00483565 ET00495822 ET00502504 ET00475942 ET00516631'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install -r requirements.txt
    - run: python probe_scope.py "$MAIN" "$OTHERS"
      env:
        MAIN: ${{ inputs.main }}
        OTHERS: ${{ inputs.others }}
