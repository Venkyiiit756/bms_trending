name: Probe BookMyShow ratings

# Manual diagnostic: prints which response fields carry the audience rating, votes and review information.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Event codes, space separated'
        required: true
        default: 'ET00524017 ET00451914'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install -r requirements.txt
    - run: python probe_ratings.py $CODES
      env:
        CODES: ${{ inputs.codes }}
