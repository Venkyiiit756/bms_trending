name: BMS Trend Tracker

# One long-running job polls every INTERVAL_SECONDS for up to RUN_MINUTES.
# The hourly schedule is only a safety net: while a run is active, the next
# scheduled run waits in the concurrency queue and starts as soon as the
# current one finishes, so polling continues with minimal gaps.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'How long this run should keep polling (minutes, max 340)'
        default: '340'

concurrency:
  group: bms-tracker
  cancel-in-progress: false

env:
  INTERVAL_SECONDS: 300
  RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Poll and Commit in a Loop
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        end=$(( $(date +%s) + RUN_MINUTES * 60 ))
        while :; do
          python tracker.py || echo "tracker.py failed; continuing"

          git add bms_booking_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update booking logs [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push failed (attempt $attempt); retrying"
              sleep $(( attempt * 5 ))
            done
          fi

          # Sleep until the next interval boundary; stop if that is past the end.
          now=$(date +%s)
          next=$(( (now / INTERVAL_SECONDS + 1) * INTERVAL_SECONDS ))
          if [ "$next" -ge "$end" ]; then
            echo "Run window finished."
            break
          fi
          sleep $(( next - now ))
        done
