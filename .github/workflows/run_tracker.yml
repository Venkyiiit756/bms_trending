name: BMS Trend Tracker

# One long-running job polls every minute for up to RUN_MINUTES; tracker.py logs
# only changes plus a heartbeat and pushes them. The last step then dispatches the
# next run, which waits in the concurrency queue and starts as soon as this one
# ends. The hourly schedule is only a backup in case the chain is ever broken
# (GitHub often skips scheduled runs).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'How long this run should keep polling (minutes, max 340)'
        default: '340'
      chain:
        description: 'Start another run when this one finishes (set false for tests)'
        default: 'true'

concurrency:
  group: bms-tracker
  cancel-in-progress: false

env:
  RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Poll BookMyShow
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        python tracker.py --minutes "$RUN_MINUTES" --commit

    - name: Queue Next Run
      if: always() && github.event.inputs.chain != 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run run_tracker.yml --repo "$GITHUB_REPOSITORY" --ref main
