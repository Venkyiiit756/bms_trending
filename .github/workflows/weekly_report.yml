name: Weekly Report

# Monday morning (08:20 IST, started by tracker.py; the cron is only a backup) write last week's ticket story.
# weekly.py: Python computes every figure, Claude (ANTHROPIC_API_KEY secret) writes the words, numbers are checked.
on:
  schedule:
    - cron: '50 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Write it again even if this week already has a report'
        type: boolean
        default: false

concurrency:
  group: bms-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install anthropic
    - name: Write the report
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        FORCE: ${{ inputs.force }}
      run: |
        if [ "$FORCE" = "true" ]; then python weekly.py --force; else python weekly.py; fi
    - name: Commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add weekly.json weeklies
        git diff --cached --quiet && exit 0
        git commit -m "Weekly report [skip ci]"
        for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
