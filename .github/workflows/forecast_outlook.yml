name: Forecast Outlook

# Three times a day (11:10, 16:10, 20:10 IST, started by tracker.py; the cron is only a backup) forecast.py writes the short
# outlook text next to the forecast numbers: Claude (ANTHROPIC_API_KEY secret) explains the statistics, every number is checked
# against the facts, and a plain template is used otherwise. The numbers themselves are recomputed every hour by build_site.py.
on:
  schedule:
    - cron: '40 5,10,14 * * *'
  workflow_dispatch:

concurrency:
  group: bms-outlook
  cancel-in-progress: false

jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install anthropic
    - name: Write the outlook
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: python forecast.py --outlook
    - name: Commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add outlook.json
        git diff --cached --quiet && exit 0
        git commit -m "Forecast outlook [skip ci]"
        for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
