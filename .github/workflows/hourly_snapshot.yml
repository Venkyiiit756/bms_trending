name: Hourly Snapshot Images

# Requested by the running tracker at :05 and :35 IST (cron below is only a backup).
# Each run: snapshot tables for missed half-hours, the hourly X post (08:00-23:00), a health
# check, and the website. Images live only in the website repository.
on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

concurrency:
  group: bms-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      SITE_REPO: ${{ vars.SITE_REPO || 'Venkyiiit756/hyd-movie-trends' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install matplotlib requests requests-oauthlib
    - name: Make snapshots
      run: python snapshot.py
    - name: Hourly post (X)
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      run: python posts.py
    - name: Health check
      env:
        GH_TOKEN: ${{ github.token }}
      run: python health.py
    - name: Commit snapshot data and post log
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add snapshots posts_log.json 2>/dev/null || git add snapshots
        git diff --cached --quiet && exit 0
        git commit -m "Snapshot data and post log [skip ci]"
        for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

    # Publish to the separate public site repository (GitHub Pages). Adds new files only and
    # prunes dated folders older than 45 days. Needs the SITE_TOKEN secret; skipped without it.
    - name: Build website
      run: python build_site.py
    - name: Publish website
      env:
        SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
      run: |
        if [ -z "$SITE_TOKEN" ]; then echo "SITE_TOKEN not set; skipping website publish"; exit 0; fi
        git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git" ../site_repo
        cd ../site_repo
        cp -r "$GITHUB_WORKSPACE/site/." .
        python3 - <<'PY'
        import os, re, shutil, datetime
        cutoff = (datetime.date.today() - datetime.timedelta(days=45)).isoformat()
        for top in ('snapshots', 'posts'):
            if os.path.isdir(top):
                for d in os.listdir(top):
                    if re.fullmatch(r'\d{4}-\d\d-\d\d', d) and d < cutoff:
                        shutil.rmtree(os.path.join(top, d))
        PY
        git add -A
        git diff --cached --quiet && exit 0
        git config user.name "site-bot"
        git config user.email "site-bot@users.noreply.github.com"
        git commit -qm "Update site"
        for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
