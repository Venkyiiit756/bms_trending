name: Probe BookMyShow listing paths
# One-off, manual. Writes probe_output.txt to the repo.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install -r requirements.txt
    - run: python probe.py
    - run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add probe_output.txt
        git commit -m "Probe output [skip ci]" || exit 0
        for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
